name: Build Windows

# Quando este build roda:
#  - Manualmente, pelo botão "Run workflow" na aba Actions do GitHub
#  - Automaticamente, quando você cria uma tag começando com "v" (ex: v0.1.0)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Dá ao token do Actions permissão de escrita no repo, necessária para
# o passo que cria a página de Release (sem isso, dá erro 403).
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o instalador (.exe NSIS)
        run: npm run pack:exe

      # Deixa o .exe disponível pra baixar na própria página da execução,
      # mesmo quando o build foi disparado manualmente (sem tag).
      - name: Publicar o .exe como artefato
        uses: actions/upload-artifact@v4
        with:
          name: CarcaraCode-Setup
          # Inclui o `latest.yml` e o blockmap: sem eles, um publish que falhou so se
          # recupera rebuildando (o `latest.yml` carrega o sha512 do .exe exato).
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          retention-days: 30
          if-no-files-found: error

      # Só quando for uma tag (ex: v0.1.0): cria uma página de Release
      # com o .exe anexado — link bonito e fácil de mandar pra alguém baixar.
      # Retry + conferencia dos assets ficam na action composta (ver DESAFIOS.md:
      # um 5xx de um segundo na v0.1.13 publicou a release sem `latest.yml` e derrubou
      # o auto-update). `latest.yml` e o blockmap sao o que o electron-updater consome.
      - name: Publicar Release (somente em tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/publicar-release
        with:
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
