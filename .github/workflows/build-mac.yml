name: Build macOS

# Quando este build roda:
#  - Manualmente, pelo botão "Run workflow" na aba Actions do GitHub
#  - Automaticamente, quando você cria uma tag começando com "v" (ex: v0.1.0)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-mac.yml'
      - 'electron/**'
      - 'scripts/**'
      - 'main.js'
      - 'preload.js'
      - 'package.json'
      - 'package-lock.json'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Dois .dmg NATIVOS, um por arquitetura, cada um no runner certo — em vez de um
# "universal" único. Cada job recompila os módulos nativos para a ABI do Electron e
# para a arquitetura do próprio runner; assim node-pty, canvas, cpu-features e afins
# não vazam binários do Node do sistema nem da outra arquitetura para o pacote.
#  - macos-15-intel = Intel (x64) · macos-15 = Apple Silicon (arm64).
# O label macos-13 foi descontinuado pelo GitHub Actions em dezembro de 2025.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            uname: x86_64
            app_dir: release/mac
          - runner: macos-15
            arch: arm64
            uname: arm64
            app_dir: release/mac-arm64
    name: Build mac (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Confirmar arquitetura nativa do runner
        run: |
          test "$(node -p process.arch)" = "${{ matrix.arch }}"
          test "$(uname -m)" = "${{ matrix.uname }}"

      - name: Rodar testes de plataforma e módulos nativos
        run: |
          npm test
          npm run test:platform
          npm run test:localpty

      - name: Gerar o app da arquitetura do runner
        env:
          # O package.json usa assinatura ad-hoc (identity "-"): funciona sem
          # certificado local e mantém a integridade exigida pelo Apple Silicon.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build
          # O nome técnico precisa ficar em ASCII no macOS 26; o nome visível da
          # janela continua sendo "Carcará Code", definido pelo próprio app.
          npx electron-builder --mac dir --${{ matrix.arch }} --publish never --config.npmRebuild=true --config.productName=CarcaraCode
          # Reaplica a assinatura ad-hoc depois de o bundle estar completo. Isso
          # evita CodeResources inconsistente em imagens novas dos runners.
          codesign --force --deep --sign - "${{ matrix.app_dir }}/CarcaraCode.app"

      - name: Auditar arquitetura do app e dos addons nativos
        run: npm run verify:mac-arch -- ${{ matrix.arch }} "${{ matrix.app_dir }}"

      - name: Criar o instalador DMG com a ferramenta nativa do macOS
        run: |
          staging_dir="$(mktemp -d "${RUNNER_TEMP}/carcara-dmg.XXXXXX")"
          trap 'find "$staging_dir" -depth -delete' EXIT
          ditto "${{ matrix.app_dir }}/CarcaraCode.app" "$staging_dir/CarcaraCode.app"
          ln -s /Applications "$staging_dir/Applications"
          version="$(node -p "require('./package.json').version")"
          hdiutil create \
            -volname "CarcaraCode ${version}" \
            -srcfolder "$staging_dir" \
            -ov \
            -format UDZO \
            "release/CarcaraCode-${version}-${{ matrix.arch }}.dmg"
          hdiutil verify "release/CarcaraCode-${version}-${{ matrix.arch }}.dmg"

      - name: Publicar o .dmg como artefato
        uses: actions/upload-artifact@v4
        with:
          name: CarcaraCode-macOS-${{ matrix.arch }}
          path: release/*.dmg
          retention-days: 30
          if-no-files-found: error

      # Só em tags: anexa o .dmg desta arch à MESMA página de Release (upsert). Os dois
      # jobs somam CarcaraCode-<versão>-x64.dmg e -arm64.dmg. (Sem latest-mac.yml: os dois
      # jobs gerariam o mesmo nome e um sobrescreveria o outro; auto-update do Mac não é
      # usado por ora.)
      - name: Publicar Release (somente em tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
          generate_release_notes: true
